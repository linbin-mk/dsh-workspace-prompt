# Publish @linbin-mk/dsh-workspace-prompt to npm from a GitHub Release.
#
# Authentication uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is
# stored in this repository. The connection is configured once on npm:
#
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : linbin-mk
#     Repository           : dsh-workspace-prompt
#     Workflow filename    : publish.yml
#     Environment          : (leave empty)
#     Allow npm publish    : CHECKED (the default grants staged publishing only)
#
# npm has no pending-publisher concept, so the first version must be published
# by hand before this workflow can publish anything.
#
# Releasing: bump "version" in package.json, commit, tag `v<version>`, push the
# tag, then publish a GitHub Release for that tag. The tag must agree with
# package.json, and a version that is already on the registry is skipped — so a
# manual `workflow_dispatch` run is a safe rehearsal that only builds and tests.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing and provenance.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Require npm 11.5.1 or later for trusted publishing
        run: |
          node -e '
            const { execSync } = require("node:child_process")
            const version = execSync("npm --version").toString().trim()
            console.log(`npm ${version}`)
            const [major, minor] = version.split(".").map(Number)
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error("npm 11.5.1 or later is required for trusted publishing")
              process.exit(1)
            }
          '

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The build must not be skipped: `lib/` is committed and shipped, and
      # tests/manifest-identity.spec.ts compares it against a fresh build, so a
      # stale artifact fails here instead of reaching the registry.
      - run: pnpm build

      - run: pnpm test

      - name: Check the release tag against package.json
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const { version } = require("./package.json")
            const tag = process.env.RELEASE_TAG
            if (tag !== `v${version}`) {
              console.error(`release tag ${tag} does not match package.json ${version}`)
              process.exit(1)
            }
            console.log(`release tag ${tag} matches package.json`)
          '

      - name: Check whether this version is already published
        id: registry
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@linbin-mk/dsh-workspace-prompt@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@linbin-mk/dsh-workspace-prompt@$version is already on the registry — nothing to publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # --ignore-scripts keeps the committed lib/ untouched, so the published
      # tarball stays byte-identical to the tagged source tree.
      - name: Publish to npm
        if: ${{ github.event_name == 'release' && steps.registry.outputs.published == 'false' }}
        run: npm publish --ignore-scripts --provenance --access public
