  用途：在动插件代码之前对齐视觉与交互。直接用浏览器打开本文件即可；
  右上角可切换 主题（浅/深）与 页面状态（默认 / 编辑中 / 空状态 / 只读）。

  保真度：设置面板骨架、卡片材料、行语法、开关/按钮/标签/输入、以及工作区
  列表的文件夹行，全部沿用 harness ui-theme token 与 ui-primitives 的尺寸；
  与 dsh-session-sync 的设置页（docs/design/settings-page-preview.html）同源。
-->

/* ==== elevation / blur 变量（ui-theme gradient-shadow-text.css） ==== */
body {
  --dsw-elevation-stroke-color: var(--dsw-alias-border-l4);
  --dsw-mask-blur: none;
  --dsw-menu-backdrop-filter: blur(40px) saturate(150%);
}
body, body * {
  --dsw-elevation-stroke: 0 0 0 0.5px var(--dsw-elevation-stroke-color);
  --dsw-elevation-panel: var(--dsw-elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, 0.03), 0 0 16px 0 rgba(0, 0, 0, 0.02);
  --dsw-elevation-prominent: var(--dsw-elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05);

/* ==== 以下 token 逐字来自 harness ui-theme: base.css + design-platform.css ==== */
/* Base variables referenced by the token sheets and component CSS but defined
 * upstream (deepsuite theme/global.css) — supplied here so the composite
 * --dsw-font-* variables resolve and motion rides the upstream curve. Code
 * font stack deliberately omits a bare `monospace` tail (Windows CJK falls
 * back to SimSun otherwise). */
:root {
  --dsh-font-family-text-default: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --dsw-font-family: var(--dsh-font-family-text-default);
  --dsw-font-family-brand: 'Montserrat', var(--dsh-font-family-text-default);
  --dsh-font-family-code-default: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas,
    'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  --ds-font-family-code: var(--dsh-font-family-code-default);
  --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ds-transition-duration: 0.2s;
  --ds-transition-duration-fast: 0.1s;
  --ds-transition-duration-slow: 0.3s;
  --dsw-radius-xs: 4px;
  --dsw-radius-sm: 8px;
  --dsw-radius-md: 12px;
  --dsw-radius-lg: 16px;
  --dsw-radius-xl: 20px;
  --dsw-radius-panel: 28px;
}

/* User font lists (--dsh-font-family-text/-code, written on body by the theme
 * boot script and ThemePresenter) lead the built-in stacks. An unset list
 * falls back to the built-in stack itself; the repeated families are inert. */
body {
  --dsw-font-family: var(--dsh-font-family-text, var(--dsh-font-family-text-default)), var(--dsh-font-family-text-default);
  --ds-font-family-code: var(--dsh-font-family-code, var(--dsh-font-family-code-default)), var(--dsh-font-family-code-default);
  --dsw-alias-settings-card-fill: var(--dsw-alias-bg-layer-2);
  --dsw-alias-settings-card-stroke: var(--dsw-alias-border-l4);
}

[data-dsh-automatic-focus]:focus,
[data-dsh-automatic-focus]:focus:focus-visible {
  outline: none;
}

/* Overlays without MenuSurface's opaque backing cannot blur page content over
 * native vibrancy reliably, so their fill stays nearly opaque on macOS. */

  --dsw-specific-menu: rgba(248, 249, 250, 0.94);
}

html[data-platform='darwin'] body[data-ds-dark-theme] {
  --dsw-specific-menu: rgba(48, 49, 54, 0.94);
}


/* ============================================================
   预览外壳：真实 token 之上只加一个舞台与工具条
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--dsw-font-family);
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
  -webkit-font-smoothing: antialiased;
}
.stage { position: fixed; inset: 0; }

/* ============================================================
   设置面板（复刻 ui-settings-general/SettingsRoot.module.css）
   ============================================================ */
.overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; }
.mask { position: absolute; inset: 0; background: var(--dsw-alias-bg-mask-1); backdrop-filter: var(--dsw-menu-backdrop-filter); }
.panel {
  position: relative;
  z-index: 1;
  display: flex;
  width: 800px;
  height: min(800px, calc(100vh - 48px));
  max-width: calc(100vw - 48px);
  border-radius: var(--dsw-radius-panel);
  overflow: hidden;
  background: var(--dsw-alias-bg-layer-2);
  box-shadow: var(--dsw-elevation-prominent);
}
.nav { flex: none; display: flex; flex-direction: column; gap: 18px; width: 188px; padding: 22px 12px 0; }
.navTitle { padding: 0 12px; font-size: 16px; line-height: 24px; font-weight: 500; }
.navList { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.navCell {
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 9px 16px 9px 12px;
  border: none; border-radius: var(--dsw-radius-md); background: transparent; cursor: pointer;
  font-family: inherit; font-size: 14px; line-height: 22px; font-weight: 400;
  color: var(--dsw-alias-label-primary); text-align: left;
}
.navCell:hover { background: var(--dsw-specific-sidebar-nav-item-hover); }
.navCell.active { background: var(--dsw-specific-sidebar-nav-item-active); }
.navIcon { flex: none; display: inline-flex; color: var(--dsw-alias-label-secondary); }
.navLabel { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.header { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; height: 54px; padding: 20px 14px 8px 10px; }
.actions { min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-left: auto; }
.close {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
  padding: 0; border: none; border-radius: var(--dsw-radius-sm); background: transparent;
  cursor: pointer; color: var(--dsw-alias-label-primary);
}
.close:hover { background: var(--dsw-alias-interactive-bg-hover); }
.options { flex: 1; min-height: 0; padding: 0 24px 0; overflow-y: auto; }

/* 按钮（复刻 ui-primitives/Button.module.css 的 outline/sm） */
.btn {
  box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  border: none; border-radius: var(--dsw-radius-md); cursor: pointer; font-family: inherit;
  font-size: 14px; line-height: 22px; color: var(--dsw-alias-label-primary); background: transparent; padding: 0 14px; height: 36px;
}
.btn:disabled { cursor: not-allowed; opacity: 0.4; }
.btn-sm { height: 28px; font-size: 12px; line-height: 18px; padding: 0 10px; border-radius: var(--dsw-radius-sm); }
.btn-outline { border: 0.5px solid var(--dsw-alias-border-l3); }
.btn-outline:hover:not(:disabled) { background: var(--dsw-alias-interactive-bg-hover); }
.btn-primary { background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); }
.btn-primary:hover:not(:disabled) { background: var(--dsw-alias-button-primary-hover); }

/* ============================================================
   同步设置页
   ============================================================ */
.page { display: flex; flex-direction: column; gap: 12px; max-width: 720px; padding-bottom: 24px; }
.pageTitle { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; }
.pageIntro { margin: 0; font-size: 14px; line-height: 22px; color: var(--dsw-alias-label-tertiary); }

/* 卡片：官方 settings-card 材料（ModelsSection 同款） */
.card {
  border: 0.5px solid var(--dsw-alias-settings-card-stroke);
  background: var(--dsw-alias-settings-card-fill);
  border-radius: var(--dsw-radius-xl);
  padding: 14px;
  display: flex;
  flex-direction: column;
}
.card + .card { margin-top: 0; }
.cardHead { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 24px; }
.cardTitle { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.5; }
.cardMeta { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); }

/* 行语法：左标题+描述 / 右控件，发丝线分隔（UploadRow 同款） */
.row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 12px 0; }
/* 组内分隔：相邻内容块之间画 0.5px 发丝线；卡片标题后的第一块不画 */
.card > * + * { border-top: 0.5px solid var(--dsw-alias-border-l2); }
.card > .cardHead + * { border-top: none; }
.rowText { min-width: 0; }
.rowTitle { font-size: 14px; line-height: 20px; }
.rowDesc { margin-top: 2px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); }
.rowControl { flex: none; display: flex; align-items: center; gap: 8px; }

.field { display: flex; flex-direction: column; gap: 4px; padding: 12px 0; }
.label { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); }
.hint { margin: 0; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); }
.error { margin: 0; font-size: 12px; line-height: 18px; color: var(--dsw-alias-state-error-primary); }
.fieldRow { display: flex; align-items: flex-start; gap: 24px; }
/* 一行两列字段：标签在上、控件在下；左列吃满剩余宽度，右列固定宽 */
.rowFields { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 24px; align-items: start; padding: 12px 0; }
.rowFields > .field { padding: 0; }
.rowFields .select { width: 100%; }

/* 输入控件（复刻 ui-primitives/Input.module.css） */
.input, .select {
  height: 32px; padding: 0 8px; border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md); background: var(--dsw-alias-bg-layer-1);
  color: var(--dsw-alias-label-primary); font-family: inherit; font-size: 14px; line-height: 22px; outline: none;
}
.input:focus, .select:focus { border-color: var(--dsw-alias-state-business-primary); }
.input { width: 100%; }
.select { width: 148px; }
.field[data-disabled='true'] .input,
.field[data-disabled='true'] .select,
.row[data-disabled='true'] { opacity: 0.5; }
.field[data-disabled='true'] .input,
.field[data-disabled='true'] .select { cursor: not-allowed; }

/* 开关（复刻 ui-primitives/Switch.module.css） */
.switch {
  position: relative; flex: 0 0 auto; width: 36px; height: 20px; padding: 2px;
  border: 0; border-radius: 999px; background: var(--dsw-alias-border-l3); cursor: pointer;
}
.switch[aria-checked='true'] { background: var(--dsw-alias-brand-primary); }
.switch:disabled { cursor: default; opacity: 0.5; }
.switch .thumb {
  display: block; width: 16px; height: 16px; border-radius: 50%;
  background: var(--dsw-alias-switch-thumb); transition: transform 120ms ease;
}
.switch[aria-checked='true'] .thumb { background: var(--dsw-alias-label-primary-foreground); transform: translateX(16px); }

/* 标签（复刻 ui-primitives/Tag.module.css 的 capsule） */
.tag {
  display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 8px;
  font-size: 11px; line-height: 17px; font-weight: 500; white-space: nowrap;
}
.tag-warning { background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 12%, transparent); color: var(--dsw-alias-state-warn-primary); }
.tag-neutral { background: var(--dsw-alias-bg-module-platform); color: var(--dsw-alias-label-secondary); }

/* 状态详情网格（PluginInventorySettingsTab 的 .details 同款） */
.details[hidden] { display: none; }
.details { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 10px; margin: 10px 0 0; }
.details dt { color: var(--dsw-alias-label-tertiary); font-size: 11px; line-height: 17px; }
.details dd { min-width: 0; margin: 0; font-size: 12px; line-height: 18px; overflow-wrap: anywhere; }
.details dd.error { color: var(--dsw-alias-state-error-primary); }

/* 折叠日志 */
.disclosure { margin-top: 10px; padding-top: 10px; }
.disclosure > summary {
  cursor: pointer; user-select: none; list-style: none;
  font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary);
  display: flex; align-items: center; gap: 6px;
}
.disclosure > summary::-webkit-details-marker { display: none; }
.disclosure > summary .arrow { transition: transform 150ms var(--ds-ease-in-out); }
.disclosure[open] > summary .arrow { transform: rotate(90deg); }
.disclosure > summary svg { color: var(--dsw-alias-label-caption); }
.logList { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
.logEntry { display: flex; gap: 10px; padding: 6px 8px; border-radius: var(--dsw-radius-sm); background: var(--dsw-alias-bg-module-platform); font-size: 12px; line-height: 18px; }
.logTime { flex: none; color: var(--dsw-alias-label-tertiary); }

/* ============================================================
   同步会话集合：复刻侧栏会话树的行结构
   （ui-workspace/rows/Rows.module.css + WorkspaceBrowser.module.css）
   ============================================================ */
.tree { display: flex; flex-direction: column; padding: 2px 0 4px; }
.treeGroup + .treeGroup { margin-top: 4px; }
.groupRow {
  display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px;
  border-radius: var(--dsw-radius-md); cursor: pointer; user-select: none;
  color: var(--dsw-alias-label-primary);
}
.groupRow:hover { background: var(--dsw-alias-interactive-bg-hover); }
.slot { flex: none; width: 16px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
.folder { color: var(--dsw-alias-label-tertiary); }
.chevron { display: none; color: var(--dsw-alias-label-caption); }
/* 悬停时文件夹让位给展开箭头（harness 的 CSS-only 交换） */
.groupRow:hover .chevron { display: inline-flex; }
.groupRow:hover .folder { display: none; }
.groupRow[data-expanded='false'] .folderOpen { display: none; }
.groupRow[data-expanded='true'] .folderClose { display: none; }
.arrow { transition: transform 150ms var(--ds-ease-in-out); }
.groupRow[data-expanded='true'] .arrow { transform: rotate(90deg); }
.groupText { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.groupTitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px; }
.groupTail { flex: none; display: flex; align-items: center; gap: 8px; font-size: 10px; line-height: 16px; color: var(--dsw-alias-label-tertiary); }
.groupRow[data-unmatched='true'] .folder { color: var(--dsw-alias-state-warn-primary); }
.groupBody { display: flex; flex-direction: column; }
.groupRow[data-expanded='false'] + .groupBody { display: none; }

.sessRow {
  display: flex; align-items: center; height: 32px; padding: 0 8px;
  border-radius: var(--dsw-radius-md); user-select: none; color: var(--dsw-alias-label-primary);
}
.sessRow:hover, .sessRow.menuOpen { background: var(--dsw-alias-interactive-bg-hover); }
.sessRow.menuOpen { position: relative; }
.sessTitle {
  flex: 1; min-width: 0; margin: 0 6px 0 10px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; font-size: 14px; line-height: 20px;
}
.sessRow[data-present='false'] .sessTitle { color: var(--dsw-alias-label-caption); }
.sessTime { flex: none; font-size: 10px; line-height: 16px; color: var(--dsw-alias-label-tertiary); }
.sessRow:hover .sessTime, .sessRow.menuOpen .sessTime { display: none; }
.sessActions { flex: none; display: none; align-items: center; gap: 10px; }
.sessRow:hover .sessActions, .sessRow.menuOpen .sessActions { display: inline-flex; }
.iconButton {
  flex: none; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
  border: none; border-radius: var(--dsw-radius-xs); padding: 0; background: transparent;
  cursor: pointer; color: var(--dsw-alias-label-tertiary);
}
.iconButton:hover { color: var(--dsw-alias-label-primary); }
/* 状态点（复刻 ui-primitives/StateDot.module.css 的 6px core） */
.dot { position: relative; display: inline-block; flex: none; width: 16px; height: 16px; }
.dot::after { content: ''; position: absolute; inset: 20%; border-radius: 50%; background: currentColor; }
.dot[data-state='error'] { color: var(--dsw-alias-state-error-primary); }
.dot[data-state='warning'] { color: var(--dsw-alias-state-warn-primary); }
.dot[data-state='idle'] { color: var(--dsw-alias-state-idle-primary); }

/* 行内菜单 */
.menu {
  position: absolute; top: calc(100% - 2px); right: 6px; z-index: 100; min-width: 144px;
  padding: 4px; display: flex; flex-direction: column;
  border-radius: var(--dsw-radius-md); background: var(--dsw-menu-surface-fill);
  backdrop-filter: blur(20px); box-shadow: var(--dsw-elevation-prominent);
}
.menu[hidden] { display: none; }
.menuItem {
  display: flex; align-items: center; gap: 6px; width: 100%; min-height: 34px; padding: 6px 8px;
  border: none; border-radius: var(--dsw-radius-md); background: transparent; cursor: pointer;
  font-family: inherit; font-size: 13px; line-height: 20px; color: var(--dsw-alias-label-primary); text-align: left;
}
.menuItem:hover { background: var(--dsw-alias-interactive-bg-hover); }

/* 空态 */
.empty { display: flex; flex-direction: column; gap: 6px; padding: 16px 0 6px; }
.emptyTitle { font-size: 14px; line-height: 20px; color: var(--dsw-alias-label-secondary); }

/* 未匹配分组的补救说明 */
.groupNote { padding: 2px 8px 6px 30px; font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); }

/* 吸底保存条 */
.saveBar {
  position: sticky; bottom: 0; z-index: 20; margin-top: 4px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 12px; border: 0.5px solid var(--dsw-alias-settings-card-stroke);
  border-radius: var(--dsw-radius-lg); background: var(--dsw-alias-bg-layer-3);
  box-shadow: var(--dsw-elevation-panel);
}
.saveBar[hidden] { display: none; }
.saveBarText { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); }
.saveBarActions { display: flex; gap: 8px; flex: none; }

/* ============================================================
   工具条（仅预览用，不属于设计）
   ============================================================ */
.toolbar {
  position: fixed; right: 16px; top: 6px; z-index: 50;
  display: flex; gap: 14px; align-items: center;
  padding: 5px 10px; border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-3); box-shadow: var(--dsw-elevation-prominent);
  font-size: 12px; line-height: 18px;
}
.toolbarRow { display: flex; align-items: center; gap: 6px; }
.toolbarLabel { color: var(--dsw-alias-label-tertiary); margin-right: 2px; }
.tbtn {
  border: 0.5px solid var(--dsw-alias-border-l3); border-radius: var(--dsw-radius-sm);
  background: transparent; color: var(--dsw-alias-label-primary); cursor: pointer;
  font-family: inherit; font-size: 12px; line-height: 18px; height: 26px; padding: 0 10px;
}
.tbtn[aria-pressed='true'] { background: var(--dsw-alias-interactive-bg-hover); border-color: var(--dsw-alias-border-l4); }

</style>
<style>

/* ============================================================
   工作区提示词设置页（本次改版）
   ============================================================ */
.banner {
  margin: 0; padding: 10px 12px;
  border: 0.5px solid color-mix(in srgb, var(--dsw-alias-state-warn-primary) 35%, transparent);
  border-radius: var(--dsw-radius-lg);
  background: color-mix(in srgb, var(--dsw-alias-state-warn-primary) 9%, transparent);
  font-size: 12px; line-height: 18px; color: var(--dsw-alias-state-warn-label);
}
.banner[hidden] { display: none; }

.headActions { display: flex; align-items: center; gap: 12px; min-width: 0; }
.picker { position: relative; flex: none; }

.pickerMenu {
  top: calc(100% + 4px); right: 0; min-width: 280px; max-width: 380px;
  background: var(--dsw-alias-bg-layer-1);
  border: 0.5px solid var(--dsw-alias-border-l3);
  box-shadow: var(--dsw-elevation-prominent);
  backdrop-filter: none;
}
.pickerLabel {
  padding: 6px 8px 4px; font-size: 11px; line-height: 17px;
  color: var(--dsw-alias-label-tertiary);
}
.pickerItem {
  display: flex; flex-direction: column; gap: 2px; width: 100%;
  padding: 6px 8px; border: 0; border-radius: var(--dsw-radius-md);
  background: transparent; cursor: pointer; text-align: left;
  font-family: inherit; color: inherit;
}
.pickerItem:hover { background: var(--dsw-alias-interactive-bg-hover); }
.pickerTitle { font-size: 13px; line-height: 18px; color: var(--dsw-alias-label-primary); }
.pickerPath {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--dsh-font-family-code-default, monospace);
  font-size: 11px; line-height: 16px; color: var(--dsw-alias-label-tertiary);
}

.listHint {
  margin: 0; padding: 12px 8px 2px;
  font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary);
}
.listHint[hidden] { display: none; }
.card > .listHint { border-top: none; }
.card > .listHint + .wsList { border-top: none; }

.wsList { display: flex; flex-direction: column; }
.wsItem + .wsItem { border-top: 0.5px solid var(--dsw-alias-border-l2); }
.wsItem[data-enabled='false'] .folder { color: var(--dsw-alias-label-caption); }
.wsItem[data-empty] .folder { color: var(--dsw-alias-label-caption); }
.wsItem[data-empty] .wsTitle { color: var(--dsw-alias-label-secondary); }

.divider {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px 8px 4px;
  border-top: 0.5px solid var(--dsw-alias-border-l2);
}
.dividerLabel { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); }
.dividerCount { font-size: 11px; line-height: 17px; color: var(--dsw-alias-label-caption); }

.wsRow {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 8px; border-radius: var(--dsw-radius-md);
}
.wsRow:hover { background: var(--dsw-alias-interactive-bg-hover); }

.wsMain {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  padding: 0; border: 0; background: transparent; cursor: pointer;
  font-family: inherit; color: inherit; text-align: left;
}
.wsMain.static { cursor: default; }
.wsMain:focus-visible {
  outline: var(--dsw-focus-ring-width, 2px) solid
    var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  outline-offset: 2px; border-radius: var(--dsw-radius-sm);
}

.wsText { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.wsTitle {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 14px; line-height: 20px; color: var(--dsw-alias-label-primary);
}
.wsPreview {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary);
}
.wsPreview.mono {
  font-family: var(--dsh-font-family-code-default, monospace);
  font-size: 11px; line-height: 17px;
}

.wsState {
  flex: none; font-size: 12px; line-height: 18px;
  color: var(--dsw-alias-label-secondary);
}
.wsItem[data-enabled='false'] .wsState { color: var(--dsw-alias-label-tertiary); }
.wsState.muted { color: var(--dsw-alias-label-tertiary); }

.wsChevron {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; color: var(--dsw-alias-label-caption);
  transition: transform 150ms var(--ds-ease-in-out), color 120ms linear;
}
.wsRow:hover .wsChevron { color: var(--dsw-alias-label-tertiary); }
.wsItem.open .wsChevron { transform: rotate(90deg); }
.wsItem.pending .wsChevron { visibility: hidden; }

.wsEditor {
  margin: 2px 8px 12px 32px; padding: 12px;
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-module-platform);
}
.wsEditor[hidden] { display: none; }
.editorHead {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 6px;
}
.editorLabel { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); }
.editorCount {
  flex: none; font-size: 11px; line-height: 17px;
  color: var(--dsw-alias-label-tertiary); font-variant-numeric: tabular-nums;
}
.textarea {
  width: 100%; min-height: 88px; resize: vertical;
  padding: 8px 10px; border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1); color: var(--dsw-alias-label-primary);
  font-family: inherit; font-size: 13px; line-height: 22px; outline: none;
}
.textarea:focus { border-color: var(--dsw-alias-state-business-primary); }
.textarea::placeholder { color: var(--dsw-alias-label-caption); }
.textarea:disabled {
  color: var(--dsw-alias-label-tertiary); cursor: not-allowed; opacity: 0.7;
}
.editorFoot {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; margin-top: 8px;
}
.editorFoot .hint { flex: 1; min-width: 0; margin: 0; }
.editorActions { flex: none; display: flex; gap: 8px; }
.btn-danger { color: var(--dsw-alias-state-error-primary); }
.btn-danger:hover:not(:disabled) { background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 8%, transparent); }
.tag-new {
  flex: none; display: inline-flex; align-items: center; border-radius: 999px;
  padding: 1px 8px; font-size: 11px; line-height: 17px; font-weight: 500;
  color: var(--dsw-alias-state-business-primary);
  background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 12%, transparent);
}

.wsItem.flash .wsRow { animation: rowFlash 1.2s ease; }
@keyframes rowFlash {
  from { background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 14%, transparent); }
  to { background: transparent; }
}

</style>

  const pending = item.pending === true;
  return '<div class="wsEditor" hidden>'
    + '<div class="editorHead"><span class="editorLabel">提示词</span><span class="editorCount">' + chars(item.text || '') + ' 字</span></div>'
    + '<textarea class="textarea" rows="4" placeholder="为该工作区编写专属提示词…">' + esc(item.text || '') + '</textarea>'
    + '<div class="editorFoot">'
    + '<p class="hint">开关打开时，每个会话首次注入前会确认一次。</p>'
    + '<div class="editorActions">'
    + (pending
      ? '<button class="btn btn-outline btn-sm" data-act="cancel">取消</button>'
      : '<button class="btn btn-outline btn-sm btn-danger" data-act="clear">清除</button>')
    + '<button class="btn btn-primary btn-sm" data-act="save" disabled>保存</button>'
    + '</div></div></div>';
}

function configuredRowHTML(item) {
  const on = item.enabled === true;
  const title = esc(item.title);
  return '<div class="wsItem" data-path="' + esc(item.path) + '" data-enabled="' + String(on) + '">'
    + '<div class="wsRow">'
    + '<button type="button" class="wsMain" aria-expanded="false" title="' + esc(item.path) + '">'
    + '<span class="slot folder">' + ICON_FOLDER + '</span>'
    + '<span class="wsText"><span class="wsTitle">' + title + '</span>'
    + '<span class="wsPreview">' + esc(oneLine(item.text)) + '</span></span>'
    + '</button>'
    + '<span class="wsState">' + stateText(item) + '</span>'
    + '<button type="button" class="switch" role="switch" aria-checked="' + String(on) + '"'
    + ' aria-label="工作区提示词开关：' + title + '"><span class="thumb"></span></button>'
    + '<span class="wsChevron" aria-hidden="true">' + ICON_CHEVRON + '</span>'
    + '</div>'
    + editorHTML(item)
    + '</div>';
}

function pendingRowHTML(item) {
  return '<div class="wsItem pending" data-path="' + esc(item.path) + '" data-enabled="false">'
    + '<div class="wsRow">'
    + '<button type="button" class="wsMain" aria-expanded="false" title="' + esc(item.path) + '">'
    + '<span class="slot folder">' + ICON_FOLDER + '</span>'
    + '<span class="wsText"><span class="wsTitle">' + esc(item.title) + '</span>'
    + '<span class="wsPreview">尚未保存</span></span>'
    + '</button>'
    + '<span class="tag-new">新配置</span>'
    + '<span class="wsChevron" aria-hidden="true">' + ICON_CHEVRON + '</span>'
    + '</div>'
    + editorHTML(item)
    + '</div>';
}

function emptyRowHTML(item) {
  return '<div class="wsItem" data-path="' + esc(item.path) + '" data-empty="true">'
    + '<div class="wsRow">'
    + '<div class="wsMain static" title="' + esc(item.path) + '">'
    + '<span class="slot folder">' + ICON_FOLDER + '</span>'
    + '<span class="wsText"><span class="wsTitle">' + esc(item.title) + '</span>'
    + '<span class="wsPreview mono">' + esc(item.path) + '</span></span>'
    + '</div>'
    + '<span class="wsState muted">未配置</span>'
    + '</div></div>';
}

function dividerHTML(count) {
  return '<div class="divider" role="separator">'
    + '<span class="dividerLabel">未配置的工作区</span>'
    + '<span class="dividerCount">' + count + '</span>'
    + '</div>';
}

function render() {
  const conf = configured();
  const pend = pendingItems();
  const rest = unconfigured();
  let html = pend.map(pendingRowHTML).join('') + conf.map(configuredRowHTML).join('');
  if (conf.length + pend.length > 0 && rest.length > 0) html += dividerHTML(rest.length);
  html += rest.map(emptyRowHTML).join('');
  document.getElementById('p-list').innerHTML = html;
  document.getElementById('p-meta').textContent =
    '已配置 ' + conf.length + ' 个 / 共 ' + items.length + ' 个工作区';
  document.getElementById('p-hint').hidden = conf.length + pend.length > 0;
  addButton.disabled = readonly || rest.length === 0;
  addButton.setAttribute('aria-disabled', String(addButton.disabled));
  page.dataset.readonly = String(readonly);
  if (readonly) {
    for (const control of page.querySelectorAll('.switch, [data-act]')) control.disabled = true;
  }
}

function domItem(path) {
  return document.querySelector('.wsItem[data-path="' + CSS.escape(path) + '"]');
}

function closeAll() {
  for (const item of document.querySelectorAll('.wsItem.open')) {
    item.classList.remove('open');
    const editor = item.querySelector('.wsEditor');
    if (editor) editor.hidden = true;
    const main = item.querySelector('.wsMain');
    if (main) main.setAttribute('aria-expanded', 'false');
  }
}

function openItem(item) {
  if (!item) return;
  const editor = item.querySelector('.wsEditor');
  if (!editor) return;
  closeAll();
  const textarea = editor.querySelector('textarea');
  const saved = find(item.dataset.path);
  textarea.value = saved.text || '';
  textarea.disabled = readonly;
  item.classList.add('open');
  item.querySelector('.wsMain').setAttribute('aria-expanded', 'true');
  editor.hidden = false;
  updateDraft(item);
  if (!readonly) {
    textarea.focus();
    textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  }
}

function updateDraft(item) {
  const saved = find(item.dataset.path);
  const textarea = item.querySelector('textarea');
  const value = textarea.value;
  item.querySelector('.editorCount').textContent = chars(value) + ' 字';
  const save = item.querySelector('[data-act="save"]');
  if (save) save.disabled = readonly || value === (saved.text || '') || value.trim() === '';
}

function flash(path) {
  const item = domItem(path);
  if (!item) return;
  item.classList.add('flash');
  item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  window.setTimeout(() => item.classList.remove('flash'), 1200);
}

function saveItem(item) {
  const saved = find(item.dataset.path);
  saved.text = item.querySelector('textarea').value.trim();
  saved.pending = false;
  render();
  flash(saved.path);
}

function clearItem(item) {
  const saved = find(item.dataset.path);
  saved.text = null;
  saved.enabled = false;
  saved.pending = false;
  render();
  flash(saved.path);
}

function cancelItem(item) {
  const saved = find(item.dataset.path);
  saved.pending = false;
  saved.text = null;
  render();
}

function closeMenu() {
  menu.hidden = true;
  addButton.setAttribute('aria-expanded', 'false');
}

function openMenu() {
  const rest = unconfigured();
  menu.innerHTML = rest.length === 0
    ? '<div class="pickerLabel">所有工作区都已配置提示词</div>'
    : '<div class="pickerLabel">选择要配置提示词的工作区</div>'
      + rest.map((item) => '<button type="button" class="pickerItem" data-add-path="' + esc(item.path) + '">'
        + '<span class="pickerTitle">' + esc(item.title) + '</span>'
        + '<span class="pickerPath">' + esc(item.path) + '</span></button>').join('');
  menu.hidden = false;
  addButton.setAttribute('aria-expanded', 'true');
}

function toggleMenu() {
  if (menu.hidden) openMenu();
  else closeMenu();
}

function addItem(path) {
  const saved = find(path);
  if (!saved) return;
  saved.pending = true;
  saved.text = '';
  saved.enabled = false;
  closeMenu();
  render();
  openItem(domItem(path));
}

function toggleSwitch(button) {
  const item = button.closest('.wsItem');
  const saved = find(item.dataset.path);
  saved.enabled = !saved.enabled;
  button.setAttribute('aria-checked', String(saved.enabled));
  item.dataset.enabled = String(saved.enabled);
  const state = item.querySelector('.wsState');
  if (state) state.textContent = stateText(saved);
}

document.addEventListener('click', (event) => {
  const addPath = event.target.closest('[data-add-path]');
  if (addPath) {
    if (!readonly) addItem(addPath.dataset.addPath);
    return;
  }
  if (event.target.closest('#p-add')) {
    if (!readonly && !addButton.disabled) toggleMenu();
    return;
  }
  if (!event.target.closest('#p-picker')) closeMenu();

  const act = event.target.closest('[data-act]');
  if (act) {
    const item = act.closest('.wsItem');
    if (readonly) return;
    if (act.dataset.act === 'save') saveItem(item);
    else if (act.dataset.act === 'clear') clearItem(item);
    else if (act.dataset.act === 'cancel') cancelItem(item);
    return;
  }
  const sw = event.target.closest('.switch');
  if (sw) {
    if (!readonly) toggleSwitch(sw);
    return;
  }
  const row = event.target.closest('.wsRow');
  if (row !== null) {
    const item = row.closest('.wsItem');
    if (item.querySelector('.wsEditor') === null) return;
    if (item.classList.contains('open')) closeAll();
    else openItem(item);
  }
});

document.addEventListener('input', (event) => {
  if (event.target.matches('.textarea')) updateDraft(event.target.closest('.wsItem'));
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeMenu();
});

function setState(name) {
  readonly = name === 'readonly';
  items = clone(DEMO);
  if (name === 'empty') {
    items.forEach((item) => { item.text = null; item.enabled = false; });
  }
  closeAll();
  closeMenu();
  render();
  document.getElementById('p-banner').hidden = name !== 'readonly';
  for (const key of ['default', 'editing', 'empty', 'readonly']) {
    document.getElementById('s-' + key).setAttribute('aria-pressed', String(key === name));
  }
  if (name === 'editing') {
    const first = [...document.querySelectorAll('#p-list .wsItem')]
      .find((item) => item.querySelector('.wsEditor') !== null);
    if (first !== undefined) {
      openItem(first);
      const textarea = first.querySelector('textarea');
      textarea.value += '\n另外，回复末尾标注 OK。';
      updateDraft(first);
      textarea.focus();
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);
    }
  }
}

function setTheme(dark) {
  document.body.toggleAttribute('data-ds-dark-theme', dark);
  document.getElementById('t-light').setAttribute('aria-pressed', String(!dark));
  document.getElementById('t-dark').setAttribute('aria-pressed', String(dark));
}
document.getElementById('t-light').onclick = () => setTheme(false);
document.getElementById('t-dark').onclick = () => setTheme(true);
if (window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme(true);

for (const name of ['default', 'editing', 'empty', 'readonly']) {
  document.getElementById('s-' + name).onclick = () => setState(name);
}
setState('default');
</script>


</body>
</html>
